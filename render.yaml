# Render blueprint for the Scam Shield backend (FastAPI + Gnani Prisma/Timbre proxy).
# The Gnani key is set in the Render dashboard / API as a secret env var, never committed.
services:
  - type: web
    name: scam-shield-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GNANI_DAILY_CAP
        value: "400"
      - key: GNANI_API_KEY
        sync: false
